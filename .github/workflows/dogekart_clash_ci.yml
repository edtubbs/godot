name: 🐕 DogeKart Clash CI
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Custom domain for GitHub Pages CNAME"
        required: false
        default: "dogekart-clash.example.com"
      deploy_pages:
        description: "Deploy to GitHub Pages (requires Pages enabled)"
        required: false
        default: "false"
  push:
    branches:
      - "copilot/build-dogekart-clash-repo"
      - "main"
  pull_request:
    paths:
      - "setup_dogekart_clash.sh"
      - "DogeKartClash/**"
      - ".github/workflows/dogekart_clash_ci.yml"

jobs:
  scaffold-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    env:
      DOGEKART_DOMAIN: ${{ github.event.inputs.domain || vars.DOGEKART_DOMAIN || 'dogekart-clash.example.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create DogeKart scaffold
        run: |
          chmod +x "${GITHUB_WORKSPACE}/setup_dogekart_clash.sh"
          SKIP_CLONE=1 "${GITHUB_WORKSPACE}/setup_dogekart_clash.sh" /tmp/DogeKartClash

      - name: Build executable artifact
        run: |
          /tmp/DogeKartClash/scripts/dogecoin_cli_tools.sh status
          /tmp/DogeKartClash/scripts/build_executable.sh
          /tmp/DogeKartClash/scripts/build_android_apk.sh
          /tmp/DogeKartClash/scripts/build_web_bundle.sh
          /tmp/DogeKartClash/scripts/build_pup.sh
          ls -lah /tmp/DogeKartClash/godot/build
          ls -lah /tmp/DogeKartClash/godot/build/android
          ls -lah /tmp/DogeKartClash/godot/build/web
          ls -lah /tmp/DogeKartClash/pup/build

      - name: Upload executable artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: dogekart-clash-linux
          path: /tmp/DogeKartClash/godot/build/DogeKartClash-linux.tar.gz

      - name: Upload PUP artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: dogekart-clash-pup
          path: /tmp/DogeKartClash/pup/build/dogekart-clash-pup.tar.gz

      - name: Upload Android APK artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: dogekart-clash-android-apk
          path: /tmp/DogeKartClash/godot/build/android/DogeKartClash.apk

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && (github.event.inputs.deploy_pages == 'true' || vars.DOGEKART_ENABLE_PAGES == 'true')
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/DogeKartClash/godot/build/web

  deploy-pages:
    if: github.event_name != 'pull_request' && (github.event.inputs.deploy_pages == 'true' || vars.DOGEKART_ENABLE_PAGES == 'true')
    needs: scaffold-and-build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
